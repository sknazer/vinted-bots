<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinted AI — Génère ton annonce</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F2;
    --surface: #FFFFFF;
    --border: #E4E0DA;
    --text: #1A1A1A;
    --muted: #888580;
    --accent: #2D6A4F;
    --accent-light: #E8F5EE;
    --accent-text: #1B4332;
    --danger: #C0392B;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  header h1 span {
    color: var(--accent);
  }

  header p {
    margin-top: 0.5rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
  }

  .card-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  /* API key input */
  .api-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  input[type="password"], input[type="text"] {
    flex: 1;
    padding: 0.6rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus { border-color: var(--accent); }

  .api-link {
    font-size: 0.8rem;
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
  }

  .api-link:hover { text-decoration: underline; }

  /* Upload zone */
  .upload-zone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon {
    font-size: 2rem;
    margin-bottom: 0.5rem;
  }

  .upload-zone p {
    font-size: 0.875rem;
    color: var(--muted);
  }

  .upload-zone strong {
    color: var(--accent);
    font-weight: 500;
  }

  /* Photo grid */
  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
    margin-top: 1rem;
  }

  .photo-thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo-thumb button {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .photo-count {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.5rem;
  }

  /* Button */
  .btn {
    width: 100%;
    padding: 0.85rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  /* Loading */
  .loading {
    display: none;
    text-align: center;
    padding: 1.5rem;
    color: var(--muted);
    font-size: 0.875rem;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 0.75rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results */
  .result-block {
    display: none;
  }

  .result-field {
    margin-bottom: 1rem;
  }

  .result-field label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  .result-value {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.65rem 0.9rem;
    font-size: 0.9rem;
    line-height: 1.5;
    position: relative;
  }

  .title-value {
    font-size: 1rem;
    font-weight: 600;
    background: var(--accent-light);
    border-color: #A8D5BA;
    color: var(--accent-text);
  }

  .copy-btn {
    display: inline-block;
    margin-top: 0.4rem;
    font-size: 0.75rem;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    padding: 0;
    text-decoration: underline;
  }

  .tags-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    background: var(--accent-light);
    color: var(--accent-text);
    font-size: 0.8rem;
    padding: 3px 10px;
    border-radius: 99px;
    font-weight: 500;
  }

  .error-msg {
    background: #FEF2F2;
    border: 1px solid #FCA5A5;
    border-radius: var(--radius-sm);
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    color: var(--danger);
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>Vinted <span>AI</span></h1>
  <p>Ajoute tes photos → l'IA génère ton annonce en secondes</p>
</header>

<div class="container">

  <!-- Upload -->
  <div class="card">
    <div class="card-label">Photos de l'article <span style="font-weight:400">(7 max)</span></div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept="image/*" multiple />
      <div class="upload-icon">📷</div>
      <p><strong>Clique ou glisse</strong> tes photos ici</p>
      <p>JPG, PNG, WEBP</p>
    </div>
    <div class="photo-grid" id="photoGrid"></div>
    <p class="photo-count" id="photoCount"></p>
  </div>

  <!-- Bouton -->
  <button class="btn" id="generateBtn" disabled>Générer l'annonce</button>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    L'IA analyse tes photos…
  </div>

  <!-- Erreur -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Résultats -->
  <div class="card result-block" id="resultBlock">
    <div class="card-label">Ton annonce Vinted</div>

    <div class="result-field">
      <label>Titre</label>
      <div class="result-value title-value" id="resTitre"></div>
      <button class="copy-btn" onclick="copyField('resTitre')">Copier</button>
    </div>

    <div class="result-field" style="display:flex; gap:1rem; flex-wrap:wrap;">
      <div style="flex:1; min-width:120px;">
        <label>Taille</label>
        <div class="result-value" id="resTaille"></div>
      </div>
      <div style="flex:1; min-width:120px;">
        <label>État</label>
        <div class="result-value" id="resEtat"></div>
      </div>
      <div style="flex:1; min-width:120px;">
        <label>Marque</label>
        <div class="result-value" id="resMarque"></div>
      </div>
    </div>

    <div class="result-field">
      <label>Catégorie</label>
      <div class="result-value" id="resCat"></div>
    </div>

    <div class="result-field">
      <label>Description</label>
      <div class="result-value" id="resDesc" style="white-space:pre-line;"></div>
      <button class="copy-btn" onclick="copyField('resDesc')">Copier</button>
    </div>

    <div class="result-field">
      <label>Mots-clés suggérés</label>
      <div class="tags-row" id="resTags"></div>
    </div>
  </div>

</div>

<script>
const OR_KEY = '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';

const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');
const photoGrid = document.getElementById('photoGrid');
const photoCount = document.getElementById('photoCount');
const generateBtn = document.getElementById('generateBtn');
const loading = document.getElementById('loading');
const resultBlock = document.getElementById('resultBlock');
const errorMsg = document.getElementById('errorMsg');

let photos = [];

function updateBtn() {
  generateBtn.disabled = photos.length === 0;
}

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(files) {
  const remaining = 7 - photos.length;
  const toAdd = Array.from(files).slice(0, remaining);
  toAdd.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      photos.push({ dataUrl: e.target.result, file });
      renderGrid();
    };
    reader.readAsDataURL(file);
  });
}

function renderGrid() {
  photoGrid.innerHTML = '';
  photos.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'photo-thumb';
    div.innerHTML = `<img src="${p.dataUrl}" alt="photo ${i+1}"><button onclick="removePhoto(${i})">×</button>`;
    photoGrid.appendChild(div);
  });
  photoCount.textContent = photos.length > 0 ? `${photos.length}/7 photo${photos.length > 1 ? 's' : ''}` : '';
  updateBtn();
}

function removePhoto(i) {
  photos.splice(i, 1);
  renderGrid();
}

function copyField(id) {
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.innerText).then(() => {
    const btn = el.nextElementSibling;
    const orig = btn.textContent;
    btn.textContent = '✓ Copié !';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

generateBtn.addEventListener('click', generate);

async function generate() {
  if (photos.length === 0) return;

  generateBtn.disabled = true;
  loading.style.display = 'block';
  resultBlock.style.display = 'none';
  errorMsg.style.display = 'none';

  const prompt = `Tu es un expert en vente de vêtements et articles de mode sur Vinted en France.
Analyse ces photos et génère une annonce optimisée.

Réponds UNIQUEMENT en JSON valide avec cette structure exacte:
{
  "titre": "titre accrocheur max 60 caractères pour Vinted",
  "taille": "taille détectée (XS/S/M/L/XL/XXL ou numérique) ou Inconnue",
  "etat": "Neuf avec étiquette / Neuf sans étiquette / Très bon état / Bon état / Satisfaisant",
  "marque": "marque détectée ou Inconnue",
  "categorie": "catégorie Vinted (ex: Robes, T-shirts, Jeans, Chaussures...)",
  "description": "description détaillée 3-5 lignes mentionnant matière, coupe, couleur, détails, conseils de style",
  "mots_cles": ["mot1", "mot2", "mot3", "mot4", "mot5"]
}

Sois précis, accrocheur, et utilise le vocabulaire Vinted français.`;

  const content = [
    { type: 'text', text: prompt },
    ...photos.map(p => ({
      type: 'image_url',
      image_url: { url: p.dataUrl }
    }))
  ];

  try {
    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${OR_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: 'google/gemini-flash-1.5',
        messages: [{ role: 'user', content }]
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    let text = data.choices?.[0]?.message?.content || '';
    text = text.replace(/```json|```/g, '').trim();
    const json = JSON.parse(text);

    document.getElementById('resTitre').textContent = json.titre || '';
    document.getElementById('resTaille').textContent = json.taille || '';
    document.getElementById('resEtat').textContent = json.etat || '';
    document.getElementById('resMarque').textContent = json.marque || '';
    document.getElementById('resCat').textContent = json.categorie || '';
    document.getElementById('resDesc').textContent = json.description || '';

    const tagsEl = document.getElementById('resTags');
    tagsEl.innerHTML = '';
    (json.mots_cles || []).forEach(tag => {
      const span = document.createElement('span');
      span.className = 'tag';
      span.textContent = tag;
      tagsEl.appendChild(span);
    });

    resultBlock.style.display = 'block';
    resultBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (err) {
    errorMsg.textContent = '❌ Erreur : ' + (err.message || 'Vérifie ta clé API et réessaie.');
    errorMsg.style.display = 'block';
  } finally {
    loading.style.display = 'none';
    generateBtn.disabled = false;
  }
}
</script>
</body>
</html>
